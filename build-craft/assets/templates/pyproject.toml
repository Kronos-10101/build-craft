[project]
name = "myproject"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
myproject = "myproject.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = ["E", "F", "I", "UP", "B"]
lint.isort.force-single-line = false

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=myproject --cov-branch --cov-fail-under=80 -m 'not slow'"
markers = [
    "slow: integration / slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
